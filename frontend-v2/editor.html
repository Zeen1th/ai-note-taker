            <textarea class="editor-body" id="edBody" data-od-id="editor-body">## The brief

Closed-back, planar, under €300. Two real contenders on the shortlist — both comfortable enough for a full workday, neither perfect.

### Contenders

- **Audeze Maxwell** — warm, bassy, wireless, comfortable. €329.
- **Hifiman Sundara** — airy and neutral, but wants an amp. €299.

**Leaning:** Maxwell for the desk, unless the wired compromise is fine — then Sundara.

## Open questions

- Is the Sundara fine straight out of a laptop? Reviews say borderline.
- Mic quality matters for calls — Maxwell wins there too.

> Rule of thumb: buy the one that disappears on your head. Everything else is FOMO.</textarea>

<script src="assets/app.js"></script>
<script>
  const title = document.getElementById('edTitle');
  const body = document.getElementById('edBody');
  const preview = document.getElementById('edPreview');
  const saveState = document.getElementById('saveState');
  const splitBtns = Array.from(document.querySelectorAll('.split-toggle button'));
  const words = document.getElementById('edWords');

  function inline(s) {
    return s
      .replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>')
      .replace(/\*(.*?)\*/g, '<em>$1</em>')
      .replace(/`(.*?)`/g, '<code>$1</code>');
  }

  function marked(src) {
    const blocks = src.split(/\n{2,}/);
    const out = [];
    for (let block of blocks) {
      const lines = block.split('\n').filter((l) => l.trim());
      if (!lines.length) continue;
      if (/^#{1,3} /.test(lines[0])) {
        const m = /^(#{1,3}) (.*)$/.exec(lines[0]);
        out.push('<h' + m[1].length + '>' + inline(m[2]) + '</h' + m[1].length + '>');
      } else if (lines.every((l) => /^> /.test(l))) {
        out.push('<blockquote>' + lines.map((l) => inline(l.replace(/^> /, ''))).join('<br>') + '</blockquote>');
      } else if (lines.every((l) => /^[-*] /.test(l))) {
        const items = lines.map((l) => {
          const body = l.replace(/^[-*] /, '');
          const check = /^\[ \] (.*)$/.exec(body);
          return '<li>' + (check ? '<input type="checkbox" disabled> ' + inline(check[1]) : inline(body)) + '</li>';
        });
        out.push('<ul>' + items.join('') + '</ul>');
      } else {
        out.push('<p>' + lines.map((l) => inline(l)).join('<br>') + '</p>');
      }
    }
    return out.join('');
  }

  function renderPreview() {
    preview.innerHTML = marked(body.value);
  }
  renderPreview();

  splitBtns.forEach((btn) => {
    btn.addEventListener('click', () => {
      splitBtns.forEach((b) => b.classList.remove('active'));
      btn.classList.add('active');
      const mode = btn.dataset.view;
      body.style.display = mode === 'write' ? '' : 'none';
      preview.style.display = mode === 'preview' ? '' : 'none';
      if (mode === 'preview') renderPreview();
    });
  });

  let dirty = false;
  function markDirty() {
    dirty = true;
    saveState.textContent = 'Unsaved changes';
    const count = body.value.trim().split(/\s+/).filter(Boolean).length;
    words.value = count;
  }
  title.addEventListener('input', markDirty);
  body.addEventListener('input', markDirty);

  document.querySelector('[data-save-note]').addEventListener('click', (e) => {
    e.preventDefault();
    dirty = false;
    saveState.textContent = 'Saved · just now';
    words.value = body.value.trim().split(/\s+/).filter(Boolean).length;
    window.nt && window.nt.toast('Saved — ‘' + (title.value || 'Untitled') + '’');
  });

  document.addEventListener('keydown', (e) => {
    if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 's') {
      e.preventDefault();
      saveState.textContent = 'Saved · just now';
      dirty = false;
      window.nt && window.nt.toast('Note saved locally.');
    }
  });
</script>
