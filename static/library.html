<!DOCTYPE html>
<html lang="en" data-palette="notebook" data-theme="light">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Library — note·taker</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Newsreader:opsz,wght@6..72,400;6..72,500;6..72,600&family=Onest:wght@300;400;500;600;700&family=Caveat:wght@500;600;700&family=Space+Grotesk:wght@400;500;600;700&family=Inter:wght@300;400;500;600&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/kinpaku.css">
<style>
  .lib-top { display: flex; align-items: center; gap: 14px; padding: 18px 26px; }
  .lib-top .grow { flex: 1; }
  .lib-body { display: flex; gap: 18px; padding: 4px 26px 40px; min-height: 0; flex: 1; }
  .lib-col { flex: 1; min-width: 0; display: flex; flex-direction: column; }
  .lib-col.wide { flex: 1.6; }
  .lib-col .col-head { display: flex; align-items: center; gap: 10px; margin-bottom: 10px; }
  .lib-col .col-head .grow { flex: 1; }
  .filter-row { display: flex; gap: 7px; margin-top: 10px; flex-wrap: wrap; }
  /* .tag-btn folded into the shared .chip (kinpaku.css) — same mono pill + .active fill */
  .count { font-family: var(--font-mono); font-size: 0.66rem; color: var(--faint); }
  .li-ic { width: 34px; height: 34px; flex-shrink: 0; border-radius: var(--r-sm); display: grid; place-items: center; border: 1px solid var(--border); background: var(--bg-deep); color: var(--faint); }
  .li-ic.note { color: var(--accent); }
  .li-ic.rec { color: var(--patina); }
</style>
</head>
<body>
<div class="win">

  <header class="titlebar pywebview-drag-region">
    <div class="tb-left">
      <span class="brand-mark" aria-hidden="true"><svg width="18" height="18" viewBox="0 0 24 24"><rect x="2" y="2" width="20" height="20" rx="3" fill="var(--on-accent)" opacity="0.25"/><path d="M3 3l18 18" stroke="var(--on-accent)" stroke-width="2.4"/></svg></span>
      <span class="brand-name">note·taker</span>
    </div>
    <span class="tb-crumb">Library — <b>everything</b></span>
    <span class="tb-spacer"></span>
    <button class="icon-btn" data-palette-toggle title="Cycle palette — notebook / blueprint / aurora" aria-label="Switch palette">
      <span class="pal-swatch"></span>
    </button>
    <button class="icon-btn" data-theme-toggle title="Toggle light / dark" aria-label="Toggle theme">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
    </button>
    <div class="winctl">
      <button data-win="min" aria-label="Minimise"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><path d="M5 12h14"/></svg></button>
      <button data-win="max" aria-label="Maximise"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="5" y="5" width="14" height="14" rx="1.5"/></svg></button>
      <button class="close" data-win="close" aria-label="Close"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><path d="M6 6l12 12M18 6 6 18"/></svg></button>
    </div>
  </header>

  <div class="shell">
    <nav class="sidebar" aria-label="Primary">
      <a class="brand" href="index.html">
        <span class="brand-mark" aria-hidden="true"><svg width="18" height="18" viewBox="0 0 24 24"><rect x="2" y="2" width="20" height="20" rx="3" fill="var(--on-accent)" opacity="0.25"/><path d="M3 3l18 18" stroke="var(--on-accent)" stroke-width="2.4"/></svg></span>
        <span>
          <span class="brand-name">note·taker</span>
          <span class="brand-sub">local · private</span>
        </span>
      </a>

      <div class="nav">
        <span class="nav-label">Workspace</span>
        <a class="nav-item" href="board.html" data-od-id="nav-board">
          <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/></svg>
          Board <span class="nav-count">1</span>
        </a>
        <a class="nav-item active" href="library.html" data-od-id="nav-library">
          <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><rect x="3" y="3" width="7" height="18" rx="1.5"/><rect x="14" y="3" width="7" height="18" rx="1.5"/></svg>
          Library <span class="nav-count">12</span>
        </a>
        <a class="nav-item" href="record.html" data-od-id="nav-record">
          <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><path d="M12 2a3 3 0 0 1 3 3v6a3 3 0 0 1-6 0V5a3 3 0 0 1 3-3Z"/><path d="M19 10v1a7 7 0 0 1-14 0v-1M12 18v4"/></svg>
          Capture <span class="nav-count">3</span>
        </a>
        <a class="nav-item" href="editor.html" data-od-id="nav-editor">
          <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4Z"/></svg>
          New note
        </a>
        <span class="nav-label">Collections</span>
        <a class="nav-item" href="library.html#work" data-od-id="nav-col-work">Work</a>
        <a class="nav-item" href="library.html#personal" data-od-id="nav-col-personal">Personal</a>
        <a class="nav-item" href="library.html#readwise" data-od-id="nav-col-readwise">Reading</a>
      </div>

      <div class="sidebar-foot">
        <div class="foot-meta">sqlite · local-only<br>v2.0 · kinpaku build</div>
      </div>
    </nav>

    <main class="main" data-od-id="library-main">
      <div class="lib-top">
        <div class="search">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.2-3.2"/></svg>
          <input class="input" id="searchInput" type="search" placeholder="Search notes and recordings…" autocomplete="off" />
        </div>
        <span class="grow"></span>
        <span class="count" id="resultCount">0 items</span>
        <a class="btn btn-primary" href="editor.html" data-od-id="btn-new-note">+ New note</a>
        <a class="btn btn-secondary" href="record.html" data-od-id="btn-new-record">● Capture</a>
      </div>

      <div class="lib-body">
        <section class="lib-col wide" data-od-id="section-notes">
          <div class="col-head">
            <span class="eyebrow">Notes</span>
            <span class="grow"></span>
            <span class="count" id="notesCount">0</span>
          </div>
          <div class="list" id="notesList">
            <div class="empty-state" id="notesEmpty" style="display:none">
              <svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8Z"/><path d="M14 2v6h6"/></svg>
              <span>No notes match this search.</span>
            </div>
          </div>

          <div class="filter-row">
            <button class="chip active" data-filter="all">All</button>
            <button class="chip" data-filter="personal">Personal</button>
            <button class="chip" data-filter="work">Work</button>
            <button class="chip" data-filter="readwise">Reading</button>
          </div>
        </section>

        <section class="lib-col" data-od-id="section-recordings">
          <div class="col-head">
            <span class="eyebrow">Recordings</span>
            <span class="grow"></span>
            <span class="count" id="recCount">0</span>
          </div>
          <div class="list" id="recList">
            <div class="empty-state" id="recEmpty" style="display:none">
              <svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M12 2a3 3 0 0 1 3 3v6a3 3 0 0 1-6 0V5a3 3 0 0 1 3-3Z"/><path d="M19 10v1a7 7 0 0 1-14 0v-1M12 18v4"/></svg>
              <span>No recordings match this search.</span>
            </div>
          </div>
        </section>
      </div>
    </main>
  </div>
</div>

<script src="assets/app.js"></script>
<script>
  const searchInput = document.getElementById('searchInput');
  const notesList = document.getElementById('notesList');
  const recList = document.getElementById('recList');
  const notesEmpty = document.getElementById('notesEmpty');
  const recEmpty = document.getElementById('recEmpty');
  const resultCount = document.getElementById('resultCount');
  const notesCountEl = document.getElementById('notesCount');
  const recCountEl = document.getElementById('recCount');
  const filterBtns = Array.from(document.querySelectorAll('.chip[data-filter]'));
  let activeFilter = 'all';

  const NOTE_ICO = '<svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8Z"/><path d="M14 2v6h6M16 13H8M16 17H8M10 9H8"/></svg>';
  const REC_ICO = '<svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><path d="M12 2a3 3 0 0 1 3 3v6a3 3 0 0 1-6 0V5a3 3 0 0 1 3-3Z"/><path d="M19 10v1a7 7 0 0 1-14 0v-1M12 18v4"/></svg>';
  const DEL_ICO = '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M3 6h18M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2m3 0v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6"/></svg>';

  function esc(s) { const d = document.createElement('div'); d.textContent = s == null ? '' : String(s); return d.innerHTML; }
  function fmtDate(iso) {
    if (!iso) return '';
    const d = new Date(iso);
    return d.toLocaleDateString(undefined, { month: 'short', day: 'numeric' }) + ' · ' +
           d.toLocaleTimeString(undefined, { hour: '2-digit', minute: '2-digit' });
  }
  function relTime(iso) {
    if (!iso) return '';
    const diff = Date.now() - new Date(iso).getTime();
    const mins = Math.round(diff / 60000);
    if (mins < 1) return 'just now';
    if (mins < 60) return mins + 'm ago';
    const hrs = Math.round(mins / 60);
    if (hrs < 24) return hrs + 'h ago';
    const days = Math.round(hrs / 24);
    if (days === 1) return 'yesterday';
    if (days < 7) return days + 'd ago';
    return fmtDate(iso);
  }

  // ---- notes: GET /api/notes (list); open in editor with ?id= ----
  async function loadNotes() {
    try {
      const notes = await (await fetch('/api/notes')).json();
      notesList.querySelectorAll('.list-item').forEach((el) => el.remove());
      notes.forEach((n) => {
        const a = document.createElement('a');
        a.className = 'list-item';
        a.href = 'editor.html?id=' + encodeURIComponent(n.id);
        a.innerHTML =
          '<span class="li-icon note">' + NOTE_ICO + '</span>' +
          '<span class="li-body">' +
            '<span class="li-title"></span>' +
            '<span class="li-sub"></span>' +
            '<span class="li-meta"></span>' +
          '</span>' +
          '<span class="li-actions"><button class="icon-btn" title="Delete">' + DEL_ICO + '</button></span>';
        a.querySelector('.li-title').textContent = n.title;
        a.querySelector('.li-meta').textContent = relTime(n.updated_at);
        a.querySelector('.icon-btn').addEventListener('click', (e) => { e.preventDefault(); e.stopPropagation(); deleteNote(n.id, n.title, a); });
        notesList.appendChild(a);
      });
      notesCountEl.textContent = notes.length;
    } catch (err) {
      notesList.querySelectorAll('.list-item').forEach((el) => el.remove());
      window.nt && window.nt.toast('Could not load notes.');
    }
    applyFilter();
  }

  async function deleteNote(id, title, row) {
    if (!confirm('Delete “' + title + '”?')) return;
    try {
      await fetch('/api/notes/' + encodeURIComponent(id), { method: 'DELETE' });
      row.remove();
      const remaining = notesList.querySelectorAll('.list-item').length;
      notesCountEl.textContent = remaining;
      applyFilter();
      window.nt && window.nt.toast('Deleted — ‘' + title + '’');
    } catch (err) {
      window.nt && window.nt.toast('Could not delete that note.');
    }
  }

  // ---- recordings: GET /api/sessions (list); open a detail view in record.html ----
  async function loadSessions() {
    try {
      const sessions = await (await fetch('/api/sessions')).json();
      recList.querySelectorAll('.list-item').forEach((el) => el.remove());
      sessions.forEach((s) => {
        const a = document.createElement('a');
        a.className = 'list-item';
        a.href = 'record.html?session=' + encodeURIComponent(s.id);
        const dur = s.duration ? Math.round(s.duration / 60) + ' min' : '';
        const spk = (s.num_speakers || 0) + ' spk';
        a.innerHTML =
          '<span class="li-icon rec">' + REC_ICO + '</span>' +
          '<span class="li-body">' +
            '<span class="li-title"></span>' +
            '<span class="li-sub"></span>' +
            '<span class="li-meta"></span>' +
          '</span>' +
          '<span class="li-actions"><button class="icon-btn" title="Delete">' + DEL_ICO + '</button></span>';
        a.querySelector('.li-title').textContent = s.title;
        a.querySelector('.li-meta').textContent = [dur, spk, fmtDate(s.created_at)].filter(Boolean).join(' · ');
        a.querySelector('.icon-btn').addEventListener('click', (e) => { e.preventDefault(); e.stopPropagation(); deleteSession(s.id, s.title, a); });
        recList.appendChild(a);
      });
      recCountEl.textContent = sessions.length;
    } catch (err) {
      recList.querySelectorAll('.list-item').forEach((el) => el.remove());
      window.nt && window.nt.toast('Could not load recordings.');
    }
    applyFilter();
  }

  async function deleteSession(id, title, row) {
    if (!confirm('Delete “' + title + '”? This removes its transcript, notes, and audio.')) return;
    try {
      await fetch('/api/sessions/' + encodeURIComponent(id), { method: 'DELETE' });
      row.remove();
      const remaining = recList.querySelectorAll('.list-item').length;
      recCountEl.textContent = remaining;
      applyFilter();
      window.nt && window.nt.toast('Deleted — ‘' + title + '’');
    } catch (err) {
      window.nt && window.nt.toast('Could not delete that recording.');
    }
  }

  function applyFilter() {
    const q = searchInput.value.trim().toLowerCase();
    let visible = 0, total = 0;
    [notesList, recList].forEach((list) => {
      const items = Array.from(list.querySelectorAll('.list-item'));
      items.forEach((item) => {
        total++;
        const hay = (item.textContent || '').toLowerCase();
        const show = !q || hay.includes(q);
        item.style.display = show ? '' : 'none';
        if (show) visible++;
      });
    });
    notesEmpty.style.display = (!q && notesList.querySelectorAll('.list-item').length === 0) ? 'block' : 'none';
    const recVisible = Array.from(recList.querySelectorAll('.list-item')).filter((i) => i.style.display !== 'none').length;
    recEmpty.style.display = recList.querySelectorAll('.list-item').length === 0 || (q && recVisible === 0) ? 'block' : 'none';
    resultCount.textContent = visible + ' of ' + total + ' items';
  }

  searchInput.addEventListener('input', applyFilter);
  filterBtns.forEach((btn) => {
    btn.addEventListener('click', () => {
      filterBtns.forEach((b) => b.classList.remove('active'));
      btn.classList.add('active');
      activeFilter = btn.dataset.filter;
      // Category chips filter notes client-side by inferred category. Since the
      // backend has no category column, filter heuristically by text; "All" resets.
      const notes = Array.from(notesList.querySelectorAll('.list-item'));
      notes.forEach((item) => {
        if (activeFilter === 'all') { item.dataset.catForce = ''; return; }
        const hay = (item.textContent || '').toLowerCase();
        const map = { personal: ['personal', 'grocery', 'ideas', 'memo', 'headphone'], work: ['work', 'sprint', 'client', 'meeting', 'sync'], readwise: ['reading', 'book', 'ddia', 'notes on'] };
        const kws = map[activeFilter] || [];
        item.dataset.catForce = kws.some((k) => hay.includes(k)) ? '' : 'hide';
      });
      applyFilterForce();
    });
  });
  function applyFilterForce() {
    Array.from(notesList.querySelectorAll('.list-item')).forEach((item) => {
      if (item.dataset.catForce === 'hide') item.style.display = 'none';
    });
    const q = searchInput.value.trim().toLowerCase();
    const visibleNotes = Array.from(notesList.querySelectorAll('.list-item')).filter((i) => i.style.display !== 'none').length;
    notesEmpty.style.display = (activeFilter !== 'all' && visibleNotes === 0 && !q) ? 'block' : 'none';
    notesEmpty.querySelector('span').textContent = activeFilter !== 'all' ? 'No ' + activeFilter + ' notes.' : 'No notes match this search.';
    // recount
    let visible = 0, total = 0;
    [notesList, recList].forEach((list) => {
      Array.from(list.querySelectorAll('.list-item')).forEach((item) => {
        total++;
        if (item.style.display !== 'none') visible++;
      });
    });
    resultCount.textContent = visible + ' of ' + total + ' items';
  }

  loadNotes();
  loadSessions();
</script>
</body>
</html>
